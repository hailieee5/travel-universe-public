<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Travel Universe public edition architecture</title>
  <desc id="desc">A Next.js application that reads city data from JSON and serves privacy-safe static assets from public.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
    <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.title{fill:#fff;font-size:22px;font-weight:700}.sub{fill:#94a3b8;font-size:12px}.group{fill:#fbbf24;font-size:12px;font-weight:700}.node-title{fill:#fff;font-size:13px;font-weight:700}.node-copy{fill:#94a3b8;font-size:10px}.note{fill:#cbd5e1;font-size:10px}.tiny{fill:#64748b;font-size:9px}</style>
  </defs>
  <rect width="1200" height="720" fill="#020617"/>
  <rect width="1200" height="720" fill="url(#grid)"/>
  <text x="48" y="55" class="title">Travel Universe · Public Edition Architecture</text>
  <text x="48" y="78" class="sub">Next.js 16 · React 19 · self-contained static media · privacy-safe photo library</text>

  <path d="M180 358H240 M440 262H505 M440 430H505 M735 262H795 M735 430H795 M955 332H1020 M1020 454H955" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M440 320H505" fill="none" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#cyan-arrow)"/>
  <path d="M735 320H795" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="454" y="251" class="tiny">route props</text><text x="454" y="419" class="tiny">content manifest</text><text x="744" y="309" class="tiny">asset URLs</text><text x="964" y="321" class="tiny">optimized delivery</text>

  <rect x="48" y="312" width="132" height="92" rx="8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="114" y="345" text-anchor="middle" class="node-title">Browser</text><text x="114" y="367" text-anchor="middle" class="node-copy">navigation · motion</text><text x="114" y="384" text-anchor="middle" class="node-copy">map · photo viewer</text>

  <rect x="240" y="116" width="520" height="470" rx="14" fill="#fbbf2409" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="8 4"/>
  <text x="262" y="143" class="group">NEXT.JS APPLICATION</text>
  <rect x="270" y="205" width="170" height="108" rx="8" fill="#08334466" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="355" y="237" text-anchor="middle" class="node-title">App Router pages</text><text x="355" y="258" text-anchor="middle" class="node-copy">/ · /city/[city]</text><text x="355" y="279" text-anchor="middle" class="node-copy">server renders route data</text>
  <rect x="270" y="373" width="170" height="108" rx="8" fill="#08334466" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="355" y="405" text-anchor="middle" class="node-title">Client experience</text><text x="355" y="426" text-anchor="middle" class="node-copy">UniverseScene · map UI</text><text x="355" y="447" text-anchor="middle" class="node-copy">Polaroids · PhotoViewer</text>
  <rect x="505" y="205" width="230" height="108" rx="8" fill="#064e3b66" stroke="#34d399" stroke-width="1.5"/>
  <text x="620" y="237" text-anchor="middle" class="node-title">travel-data</text><text x="620" y="258" text-anchor="middle" class="node-copy">city, place and photo manifest</text><text x="620" y="279" text-anchor="middle" class="node-copy">builds static /photos URLs</text>
  <rect x="505" y="373" width="230" height="108" rx="8" fill="#4c1d9566" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="620" y="405" text-anchor="middle" class="node-title">Next Image</text><text x="620" y="426" text-anchor="middle" class="node-copy">responsive thumbnails</text><text x="620" y="447" text-anchor="middle" class="node-copy">optimized viewer delivery</text>

  <rect x="795" y="205" width="160" height="108" rx="8" fill="#4c1d9566" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="875" y="237" text-anchor="middle" class="node-title">data/*.json</text><text x="875" y="258" text-anchor="middle" class="node-copy">Kyoto · Munich</text><text x="875" y="279" text-anchor="middle" class="node-copy">places and map positions</text>
  <rect x="795" y="373" width="160" height="108" rx="8" fill="#4c1d9566" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="875" y="405" text-anchor="middle" class="node-title">public/</text><text x="875" y="426" text-anchor="middle" class="node-copy">maps · stickers · art</text><text x="875" y="447" text-anchor="middle" class="node-copy">audio · processed photos</text>

  <rect x="1020" y="278" width="136" height="108" rx="8" fill="#4c1d9566" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1088" y="310" text-anchor="middle" class="node-title">Static media</text><text x="1088" y="331" text-anchor="middle" class="node-copy">map / universe</text><text x="1088" y="352" text-anchor="middle" class="node-copy">illustrations</text>
  <rect x="1020" y="432" width="136" height="108" rx="8" fill="#88133766" stroke="#fb7185" stroke-width="1.5"/>
  <text x="1088" y="464" text-anchor="middle" class="node-title">Public photos</text><text x="1088" y="485" text-anchor="middle" class="node-copy">EXIF removed</text><text x="1088" y="506" text-anchor="middle" class="node-copy">faces pixelated</text>

  <text x="48" y="645" class="note">Public-repo boundary: no local photo folders, absolute paths or photo-serving API route are included.</text>
  <rect x="48" y="671" width="14" height="10" rx="2" fill="#083344" stroke="#22d3ee"/><text x="70" y="680" class="tiny">frontend</text>
  <rect x="150" y="671" width="14" height="10" rx="2" fill="#064e3b" stroke="#34d399"/><text x="172" y="680" class="tiny">application logic</text>
  <rect x="308" y="671" width="14" height="10" rx="2" fill="#4c1d95" stroke="#a78bfa"/><text x="330" y="680" class="tiny">static content</text>
  <rect x="445" y="671" width="14" height="10" rx="2" fill="#881337" stroke="#fb7185"/><text x="467" y="680" class="tiny">privacy control</text>
</svg>
